<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <!-- Tell browsers not to scale the viewport automatically -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Summon the Dragon HTML</title>
        <link rel="icon" href="favicon.ico" />

        <!-- Include bootstrap CSS framework -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi"
            crossorigin="anonymous"
        />

        <link rel="stylesheet" href="main.css" />
        <link rel="stylesheet" href="play.css" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster:wght@400&display=swap">

    </head>
    
    <body class="bg-dark text-light">
        <header class="container-fluid">
            <nav class="navbar navbar-dark">
                <a class="navbar-brand" href="#">Summon the Dragon<sup>&reg;</sup></a> <!-- the '#' takes you to the top of the page -->
                <menu class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li> <!-- idk why they added "active" here-->
                    <li class="nav-item"><a class="nav-link" href="lobby.html">Lobby</a></li>
                    <li class="nav-item"><a class="nav-link" href="play.html">Play</a></li>
                    <li class="nav-item"><a class="nav-link" href="scores.html">Scores</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                </menu>
            </nav>
        </header>

        <main>
            <div id="info-area">
                <p>Trump Suit: ♣</p>
                <p>Team 1 Score: 5</p>
                <p>Team 2 Score: 2</p>
            </div>
            <div id="play-area">
                
                <section class="game-area-section">
                    <div>
                        <div class="card clubs">
                            <div class="rank">4</div>
                            <div class="suit">♣</div>
                        </div>
                    </div>
                    <div>
                        <div>
                            <div class="card clubs">
                                <div class="rank">Q</div>
                                <div class="suit">♣</div>
                            </div>
                        </div>
                        <div>
                            <div class="card empty">
                                <div class="rank"></div>
                                <div class="suit"></div>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="card clubs">
                            <div class="rank">A</div>
                            <div class="suit">♣</div>
                        </div>
                    </div>


                </section>

                <section class="south-player game-area-section">
                    <div class="card clubs">
                        <div class="rank">8</div>
                        <div class="suit">♣</div>
                    </div>
                    <div class="card diamonds">
                        <div class="rank">4</div>
                        <div class="suit">♦</div>
                    </div>
                    <div class="card spades">
                        <div class="rank">A</div>
                        <div class="suit">♠</div>
                    </div>
                    <div class="card hearts">
                        <div class="rank">Q</div>
                        <div class="suit">♥</div>
                    </div>
                    <div class="card hearts">
                        <div class="rank">2</div>
                        <div class="suit">♥</div>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <span class="text-reset">Brian Cate</span>
            <a href="https://github.com/briancate/startup">Github</a>
        </footer>
    </body>
    
</html>
